[package]
name = "pinboard"
version = "0.2.2"
description = "PinBoard - desktop pinned text clipboard helper"
authors = ["PinBoard"]
license = "MIT"
edition = "2021"

[lib]
name = "pinboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
